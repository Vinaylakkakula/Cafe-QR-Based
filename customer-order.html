<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Order — MAHA FAST FOOD COURT</title>
<meta name="description" content="Scan QR & Order from your table at MAHA FAST FOOD COURT">
<meta name="theme-color" content="#f2a43a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAHA Order">
<link rel="manifest" href="manifest-customer.json">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  :root {
    --bg: #0f1114;
    --bg1: #16191e;
    --bg2: #1e2128;
    --bg3: #252930;
    --line: #2a2f38;
    --line2: #363c48;
    --text: #e8eaf0;
    --text-dim: #9aa0ae;
    --text-muted: #5a6070;
    --amber: #f2a43a;
    --amber-bright: #f5b84c;
    --amber-soft: rgba(242,164,58,.14);
    --green: #6bbf7b;
    --red: #e26060;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 120px;
  }

  /* Header */
  .header {
    background: var(--bg1);
    border-bottom: 1px solid var(--line);
    padding: 16px 18px;
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-left { display: flex; flex-direction: column; gap: 2px; }
  .cafe-name { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .table-tag {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--amber-soft); border: 1px solid rgba(242,164,58,.25);
    color: var(--amber-bright); border-radius: 20px;
    font-size: 11px; font-weight: 600; padding: 3px 10px;
    width: fit-content;
  }
  .cart-btn {
    position: relative;
    background: var(--amber);
    color: #000;
    border: none; border-radius: 10px;
    padding: 10px 16px;
    font-weight: 700; font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: background .15s;
  }
  .cart-btn:hover { background: var(--amber-bright); }
  .cart-badge {
    position: absolute; top: -6px; right: -6px;
    background: var(--red); color: #fff;
    font-size: 10px; font-weight: 800;
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--bg);
  }

  /* Category tabs */
  .cat-scroll {
    overflow-x: auto; display: flex; gap: 6px;
    padding: 12px 16px;
    scrollbar-width: none;
    border-bottom: 1px solid var(--line);
    background: var(--bg1);
    position: sticky; top: 73px; z-index: 40;
  }
  .cat-scroll::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    border: 1.5px solid var(--line);
    color: var(--text-dim);
    background: transparent;
    transition: all .15s;
    white-space: nowrap;
  }
  .cat-tab.active {
    background: var(--bg2); border-color: var(--amber);
    color: var(--amber-bright);
  }

  /* Menu grid */
  .menu-section { padding: 16px; }
  .section-heading {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--text-muted);
    margin-bottom: 12px; margin-top: 4px;
  }
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }
  .menu-card {
    background: var(--bg1); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
    cursor: pointer; transition: border-color .15s, transform .15s;
    display: flex; flex-direction: column;
  }
  .menu-card:active { transform: scale(.97); }
  .menu-card:hover { border-color: var(--line2); }
  .menu-card.unavail { opacity: .4; pointer-events: none; }
  .menu-img {
    width: 100%; aspect-ratio: 3/2;
    background: var(--bg3); overflow: hidden; position: relative;
  }
  .menu-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .veg-dot {
    position: absolute; top: 7px; left: 7px;
    width: 14px; height: 14px;
    background: rgba(14,15,17,.82); border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .veg-dot::after {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
  }
  .veg-dot.veg::after { background: var(--green); }
  .veg-dot.nonveg::after { background: var(--red); }
  .menu-body { padding: 10px; flex: 1; display: flex; flex-direction: column; }
  .menu-name { font-size: 12px; font-weight: 600; line-height: 1.3; margin-bottom: 3px; }
  .menu-desc { font-size: 10px; color: var(--text-dim); line-height: 1.4; flex: 1; margin-bottom: 8px; }
  .menu-foot { display: flex; align-items: center; justify-content: space-between; }
  .menu-price { font-size: 13px; font-weight: 700; color: var(--amber-bright); font-family: 'Courier New', monospace; }
  .add-btn {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--amber-soft); border: 1px solid rgba(242,164,58,.3);
    color: var(--amber-bright); font-size: 18px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-weight: 400; transition: background .15s;
  }
  .add-btn:hover { background: var(--amber); color: #000; }
  .qty-badge {
    background: var(--amber); color: #000;
    font-size: 10px; font-weight: 800;
    padding: 2px 7px; border-radius: 8px;
    font-family: 'Courier New', monospace;
  }

  /* Cart drawer */
  .cart-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 100; backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .cart-overlay.open { opacity: 1; pointer-events: all; }
  .cart-drawer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg1); border-radius: 18px 18px 0 0;
    border-top: 1px solid var(--line2);
    z-index: 101;
    transform: translateY(100%); transition: transform .25s cubic-bezier(.16,1,.3,1);
    max-height: 85vh; display: flex; flex-direction: column;
  }
  .cart-drawer.open { transform: translateY(0); }
  .cart-handle {
    width: 40px; height: 4px; background: var(--line2);
    border-radius: 2px; margin: 12px auto 0;
    flex-shrink: 0;
  }
  .cart-head {
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .cart-title { font-size: 16px; font-weight: 700; }
  .cart-close {
    background: var(--bg3); border: none; border-radius: 50%;
    width: 28px; height: 28px; color: var(--text-dim);
    cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .cart-items { overflow-y: auto; padding: 12px 18px; flex: 1; }
  .cart-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .cart-item:last-child { border-bottom: none; }
  .ci-img {
    width: 44px; height: 44px; border-radius: 8px;
    object-fit: cover; background: var(--bg3); flex-shrink: 0;
  }
  .ci-info { flex: 1; min-width: 0; }
  .ci-name { font-size: 13px; font-weight: 600; }
  .ci-price { font-size: 11px; color: var(--text-dim); font-family: 'Courier New', monospace; }
  .ci-note-input {
    width: 100%; background: var(--bg3); border: 1px solid var(--line);
    border-radius: 6px; color: var(--text); font-size: 11px;
    padding: 4px 8px; margin-top: 4px; outline: none;
    font-family: inherit;
  }
  .ci-note-input::placeholder { color: var(--text-muted); }
  .qty-ctrl { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .qty-minus, .qty-plus {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--bg3); border: 1px solid var(--line);
    color: var(--text); font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .qty-minus:hover, .qty-plus:hover { background: var(--bg2); border-color: var(--line2); }
  .qty-num { font-size: 14px; font-weight: 700; min-width: 16px; text-align: center; }

  /* Cart footer */
  .cart-foot {
    padding: 14px 18px;
    border-top: 1px solid var(--line);
    background: var(--bg1);
    flex-shrink: 0;
  }
  .cart-total-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .ct-label { font-size: 12px; color: var(--text-dim); }
  .ct-val { font-size: 18px; font-weight: 700; color: var(--amber-bright); font-family: 'Courier New', monospace; }
  .note-area {
    width: 100%;
    background: var(--bg3); border: 1px solid var(--line);
    border-radius: 8px; color: var(--text); font-size: 12px;
    padding: 8px 10px; margin-bottom: 12px;
    resize: none; outline: none; font-family: inherit;
  }
  .note-area::placeholder { color: var(--text-muted); }
  .place-btn {
    width: 100%;
    background: var(--amber); color: #000;
    border: none; border-radius: 10px;
    padding: 14px;
    font-size: 15px; font-weight: 800;
    cursor: pointer; transition: background .15s;
  }
  .place-btn:hover { background: var(--amber-bright); }
  .place-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Sticky bottom bar */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 12px 16px 20px;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    pointer-events: none;
  }
  .bottom-bar button { pointer-events: all; }
  .view-cart-btn {
    width: 100%;
    background: var(--amber); color: #000;
    border: none; border-radius: 12px;
    padding: 14px 20px;
    font-size: 15px; font-weight: 800;
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    transition: background .15s;
    box-shadow: 0 4px 20px rgba(242,164,58,.3);
  }
  .view-cart-btn:hover { background: var(--amber-bright); }
  .vcb-right { display: flex; align-items: center; gap: 10px; }
  .vcb-count {
    background: rgba(0,0,0,.25); color: #000;
    border-radius: 8px; font-size: 12px; font-weight: 800;
    padding: 2px 8px;
  }

  /* Success screen */
  .success-screen {
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 40px 24px; text-align: center;
  }
  .success-screen.show { display: flex; }
  .success-icon { font-size: 64px; margin-bottom: 20px; animation: pop .4s cubic-bezier(.16,1,.3,1); }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .success-title { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
  .success-sub { font-size: 14px; color: var(--text-dim); line-height: 1.6; margin-bottom: 32px; }
  .success-order-id {
    background: var(--bg2); border: 1px solid var(--line2);
    border-radius: 10px; padding: 14px 24px;
    font-family: 'Courier New', monospace;
    font-size: 18px; font-weight: 700;
    color: var(--amber-bright); letter-spacing: 0.05em;
    margin-bottom: 24px;
  }
  .order-summary-card {
    width: 100%; max-width: 360px;
    background: var(--bg1); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden;
    text-align: left; margin-bottom: 24px;
  }
  .osc-head {
    background: var(--bg2); padding: 12px 16px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-dim);
    border-bottom: 1px solid var(--line);
  }
  .osc-item {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; font-size: 13px;
  }
  .osc-item:last-child { border-bottom: none; }
  .osc-item-name { color: var(--text); }
  .osc-item-right { color: var(--text-dim); font-family: 'Courier New', monospace; }

  /* Modification panel styles */
  .mod-btn {
    flex: 1;
    background: transparent; border: 1.5px solid var(--amber);
    color: var(--amber-bright); border-radius: 10px;
    padding: 10px 14px; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .15s;
  }
  .mod-btn:hover { background: var(--amber-soft); }
  .cancel-btn {
    flex: 1;
    background: transparent; border: 1.5px solid var(--red);
    color: var(--red); border-radius: 10px;
    padding: 10px 14px; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .15s;
  }
  .cancel-btn:hover { background: rgba(226, 96, 96, 0.12); }

  /* Empty state */
  .empty { padding: 60px 20px; text-align: center; color: var(--text-muted); }
  .empty-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.4; }
  .empty-msg { font-size: 13px; }

  /* Loading */
  .loading {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 16px;
  }
  .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--amber);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast-wrap {
    position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
    z-index: 200; pointer-events: none;
  }
  .toast-msg {
    background: var(--bg2); border: 1px solid var(--amber);
    color: var(--text); padding: 10px 18px; border-radius: 10px;
    font-size: 13px; font-weight: 500;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
    white-space: nowrap;
    animation: tIn .2s ease;
  }
  @keyframes tIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  @media (min-width: 480px) {
    .menu-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    body { max-width: 600px; margin: 0 auto; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>

<!-- Loading -->
<div class="loading" id="loadingScreen">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--text-dim)">Loading menu…</div>
</div>

<!-- Main ordering UI -->
<div id="mainApp" style="display:none">
  <header class="header">
    <div class="header-left">
      <div class="cafe-name" id="cafeName">MAHA FAST FOOD COURT</div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="table-tag" id="tableTag">🪑 Table —</div>
        <span id="dbStatus" style="font-size: 10px; font-weight: 600; color: var(--text-muted)">● Connecting...</span>
      </div>
    </div>
    <button class="cart-btn" id="cartBtn" onclick="openCart()">
      🛒 Cart
      <span class="cart-badge" id="cartBadge" style="display:none">0</span>
    </button>
  </header>

  <div class="cat-scroll" id="catTabs"></div>
  <div class="menu-section" id="menuContainer"></div>
</div>

<!-- Success screen -->
<div class="success-screen" id="successScreen">
  <div class="success-icon">✅</div>
  <div class="success-title">Order Placed!</div>
  <div class="success-sub" id="successSub">Your order has been sent to the kitchen.<br>We'll bring it to your table shortly.</div>
  <div class="success-order-id" id="successOrderId">#ORD-XXXX</div>
  <div class="order-summary-card">
    <div class="osc-head">Your Order</div>
    <div id="successItems"></div>
  </div>
  <div id="modificationPanel" style="margin-bottom: 24px; text-align: center; width: 100%; max-width: 360px; background: var(--bg1); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: none;">
    <div style="font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px;">
      ⏳ Modify/Cancel window: <span id="timerCountdown" style="color: var(--amber-bright); font-weight: 700;">60s</span>
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="mod-btn" id="modifyOrderBtn" onclick="modifyPlacedOrder()">Modify Order</button>
      <button class="cancel-btn" id="cancelOrderBtn" onclick="cancelPlacedOrder()">Cancel Order</button>
    </div>
  </div>
  <p style="font-size:12px;color:var(--text-muted)">Want to add more? <a href="#" onclick="resetForMoreOrdering()" style="color:var(--amber)">Continue ordering</a></p>
</div>

<!-- Bottom bar -->
<div class="bottom-bar" id="bottomBar" style="display:none">
  <button class="view-cart-btn" onclick="openCart()">
    <span>View Cart</span>
    <div class="vcb-right">
      <span class="vcb-count" id="vcbCount">0 items</span>
      <span id="vcbTotal">₹0</span>
    </div>
  </button>
</div>

<!-- Cart drawer -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-handle"></div>
  <div class="cart-head">
    <div class="cart-title">Your Order</div>
    <button class="cart-close" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="cart-total-row">
      <span class="ct-label">Subtotal</span>
      <span class="ct-val" id="cartTotal">₹0</span>
    </div>
    <textarea class="note-area" id="orderNote" rows="2" placeholder="Any special instructions? (allergies, preferences…)"></textarea>
    <button class="place-btn" id="placeBtn" onclick="placeOrder()">Send to Kitchen 🍽</button>
  </div>
</div>

<!-- Toast -->
<div class="toast-wrap" id="toastWrap" style="display:none">
  <div class="toast-msg" id="toastMsg"></div>
</div>

<script>
// ── Configuration ───────────────────────────────────────────────────────────
const STORAGE_KEY = "ember_pos_v2";
const QR_ORDERS_KEY = "vinay_qr_orders"; // New key for QR-placed orders

// ── State ───────────────────────────────────────────────────────────────────
let tableNum = null;
let currency = "₹";
let menuItems = [];
let categories = [];
let cart = []; // [{ id, name, price, qty, note, veg, img }]
let restaurantName = "MAHA FAST FOOD COURT";
let lastPlacedOrder = null;
let countdownInterval = null;

// ── Supabase client for customer page ──────────────────────────────────────
let customerSupabase = null;

function initCustomerSupabase() {
  const cfg = window.SUPABASE_CONFIG;
  if (cfg && cfg.url && cfg.key && window.supabase) {
    try {
      customerSupabase = window.supabase.createClient(cfg.url, cfg.key);
      console.log("Customer Supabase client initialized.");
      return true;
    } catch (e) {
      console.error("Failed to init customer Supabase:", e);
    }
  }
  return false;
}

// ── Init ────────────────────────────────────────────────────────────────────
async function init() {
  // Get table number from URL ?table=X
  const params = new URLSearchParams(window.location.search);
  tableNum = params.get("table");

  if (!tableNum) {
    document.getElementById("loadingScreen").innerHTML = `
      <div style="text-align:center;padding:40px;color:var(--text-dim)">
        <div style="font-size:48px;margin-bottom:16px">🔍</div>
        <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px">No table found</div>
        <div style="font-size:13px">Please scan the QR code at your table.</div>
      </div>`;
    return;
  }

  // Try Supabase first, then localStorage fallback
  initCustomerSupabase();
  await loadPOSState();
  renderApp();
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("mainApp").style.display = "block";
  
  // Show connection status
  const dbStatus = document.getElementById("dbStatus");
  if (dbStatus) {
    if (customerSupabase && menuItems.length > 0) {
      dbStatus.innerHTML = "● Online";
      dbStatus.style.color = "var(--green)";
    } else {
      dbStatus.innerHTML = "● Offline (Local Fallback)";
      dbStatus.style.color = "var(--red)";
    }
  }

  // Poll database every 5 seconds to sync menu and categories on the spot without refresh
  // Only re-render if the data actually changed to avoid image blinking
  let _lastMenuFingerprint = JSON.stringify(menuItems) + JSON.stringify(categories);
  setInterval(async () => {
    if (customerSupabase) {
      try {
        await loadPOSState();
        const newFingerprint = JSON.stringify(menuItems) + JSON.stringify(categories);
        if (newFingerprint !== _lastMenuFingerprint) {
          _lastMenuFingerprint = newFingerprint;
          renderCategories();
          renderMenu();
          console.log("Menu data changed, re-rendered.");
        }
      } catch (e) {
        console.warn("Failed to auto-sync menu and categories:", e);
      }
    }
  }, 5000);
}

async function loadPOSState() {
  // 1. Try Supabase first (works across devices)
  if (customerSupabase) {
    try {
      // Load settings
      const { data: settingsData } = await customerSupabase
        .from("pos_settings").select("data").eq("id", "global").single();
      if (settingsData && settingsData.data) {
        currency = settingsData.data.currency || "₹";
        restaurantName = settingsData.data.restaurantName || "Vinay Cafe";
      }

      // Load categories
      let loadedCategories = [];
      try {
        const { data: catData } = await customerSupabase
          .from("pos_settings").select("data").eq("id", "categories").single();
        if (catData && catData.data) {
          loadedCategories = catData.data;
        }
      } catch (e) {
        console.warn("Could not load categories from Supabase settings:", e);
      }

      // Load menu
      const { data: menuData } = await customerSupabase
        .from("pos_menu").select("*").eq("available", true);
      if (menuData && menuData.length > 0) {
        menuItems = menuData.map(m => ({
          id: m.id,
          cat: m.cat,
          name: m.name,
          desc: m.desc_text || "",
          price: parseFloat(m.price),
          veg: m.veg,
          available: m.available,
          stock: m.stock,
          img: m.img || ""
        }));
        
        if (loadedCategories && loadedCategories.length > 0) {
          categories = loadedCategories;
        } else {
          // Derive categories from menu items
          const catSet = [...new Set(menuItems.map(i => i.cat))];
          const catIcons = { veg:"🥬", egg:"🥚", chicken:"🍗", starters:"🥗", mains:"🍽", grill:"🔥", pasta:"🍝", sides:"🥔", desserts:"🍰", drinks:"🍷", beverages:"☕", snacks:"🍿", soups:"🍜", salads:"🥗", biryani:"🍚", breads:"🫓", rice:"🍚", thali:"🍛" };
          categories = catSet.map(c => ({
            id: c,
            name: c.charAt(0).toUpperCase() + c.slice(1),
            icon: catIcons[c.toLowerCase()] || "🍴"
          }));
        }
        console.log(`Loaded ${menuItems.length} items from Supabase.`);
        return; // Successfully loaded from Supabase
      }
    } catch (e) {
      console.warn("Supabase menu load failed, falling back to localStorage:", e);
    }
  }

  // 2. Fallback: localStorage (same-device only)
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const state = JSON.parse(raw);
      if (state.settings) {
        currency = state.settings.currency || "₹";
        restaurantName = state.settings.restaurantName || "Vinay Cafe";
      }
      if (state.menuItems) menuItems = state.menuItems;
      if (state.categories) categories = state.categories;
    }
  } catch(e) {}

  // 3. Fallback: hardcoded defaults
  if (!menuItems.length) {
    loadFallbackMenu();
  }
}

// ── Render ──────────────────────────────────────────────────────────────────
function renderApp() {
  document.getElementById("cafeName").textContent = restaurantName;
  if (tableNum === 9999 || tableNum === "9999" || (typeof tableNum === "string" && tableNum.toLowerCase() === "takeaway")) {
    document.getElementById("tableTag").textContent = `🛍️ Takeaway`;
  } else {
    document.getElementById("tableTag").textContent = `🪑 Table ${tableNum}`;
  }
  document.title = `Order — ${restaurantName}`;
  renderCategories();
  renderMenu();
}

let activeCat = null;

function renderCategories() {
  const cats = categories.filter(c => menuItems.some(i => i.cat === c.id && i.available));
  // Preserve activeCat if it's still in the cats list, otherwise default to first available
  if (cats.length && (!activeCat || !cats.some(c => c.id === activeCat))) {
    activeCat = cats[0].id;
  }
  const wrap = document.getElementById("catTabs");
  wrap.innerHTML = cats.map(c => `
    <button class="cat-tab ${c.id === activeCat ? 'active' : ''}"
      onclick="selectCat('${c.id}')">${c.icon} ${c.name}</button>
  `).join("");
}

function selectCat(catId) {
  activeCat = catId;
  document.querySelectorAll(".cat-tab").forEach(el => {
    el.classList.toggle("active", el.textContent.includes(categories.find(c=>c.id===catId)?.name || catId));
  });
  renderMenu();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderMenu() {
  const filtered = menuItems.filter(i => i.cat === activeCat);
  const catName = categories.find(c => c.id === activeCat)?.name || "";
  const container = document.getElementById("menuContainer");
  if (!filtered.length) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">🍽</div><div class="empty-msg">Nothing here yet.</div></div>`;
    return;
  }
  container.innerHTML = `
    <div class="section-heading">${catName}</div>
    <div class="menu-grid">
      ${filtered.map(item => {
        const inCart = cart.find(c => c.id === item.id);
        return `
        <div class="menu-card ${item.available ? '' : 'unavail'}" onclick="addToCart('${item.id}')">
          <div class="menu-img">
            ${item.img ? `<img src="${item.img}" alt="${item.name}" loading="lazy" onerror="this.style.display='none'">` : ''}
            <div class="veg-dot ${item.veg ? 'veg' : 'nonveg'}"></div>
          </div>
          <div class="menu-body">
            <div class="menu-name">${item.name}</div>
            <div class="menu-desc">${item.desc || ''}</div>
            <div class="menu-foot">
              <div class="menu-price">${currency}${item.price.toFixed(2)}</div>
              ${inCart
                ? `<span class="qty-badge">×${inCart.qty}</span>`
                : `<button class="add-btn" onclick="event.stopPropagation();addToCart('${item.id}')">+</button>`
              }
            </div>
          </div>
        </div>`;
      }).join("")}
    </div>`;
}

// ── Cart ────────────────────────────────────────────────────────────────────
function addToCart(itemId) {
  const item = menuItems.find(i => i.id === itemId);
  if (!item || !item.available) return;
  const existing = cart.findIndex(c => c.id === itemId);
  if (existing >= 0) cart[existing].qty++;
  else cart.push({ id: item.id, name: item.name, price: item.price, qty: 1, note: "", veg: item.veg, img: item.img || "" });
  updateCartUI();
  renderMenu(); // refresh qty badges
  showToast(`${item.name} added`);
}

function updateCartUI() {
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const count = cart.reduce((s, i) => s + i.qty, 0);

  // Header badge
  const badge = document.getElementById("cartBadge");
  badge.textContent = count;
  badge.style.display = count > 0 ? "flex" : "none";

  // Bottom bar
  const bar = document.getElementById("bottomBar");
  bar.style.display = count > 0 ? "block" : "none";
  document.getElementById("vcbCount").textContent = `${count} item${count!==1?'s':''}`;
  document.getElementById("vcbTotal").textContent = `${currency}${total.toFixed(2)}`;

  // Cart total
  document.getElementById("cartTotal").textContent = `${currency}${total.toFixed(2)}`;
  document.getElementById("placeBtn").disabled = count === 0;
}

function openCart() {
  renderCartItems();
  document.getElementById("cartOverlay").classList.add("open");
  document.getElementById("cartDrawer").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeCart() {
  document.getElementById("cartOverlay").classList.remove("open");
  document.getElementById("cartDrawer").classList.remove("open");
  document.body.style.overflow = "";
}

function renderCartItems() {
  const wrap = document.getElementById("cartItems");
  if (!cart.length) {
    wrap.innerHTML = `<div class="empty"><div class="empty-icon">🛒</div><div class="empty-msg">Your cart is empty.<br>Add items from the menu.</div></div>`;
    return;
  }
  wrap.innerHTML = cart.map((item, idx) => `
    <div class="cart-item">
      <img class="ci-img" src="${item.img}" alt="${item.name}" onerror="this.style.display='none'">
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        <div class="ci-price">${currency}${(item.price * item.qty).toFixed(2)}</div>
        <input class="ci-note-input" placeholder="Note (e.g. no onions)"
          value="${item.note || ''}"
          onchange="updateNote(${idx}, this.value)">
      </div>
      <div class="qty-ctrl">
        <button class="qty-minus" onclick="changeQty(${idx}, -1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-plus" onclick="changeQty(${idx}, 1)">+</button>
      </div>
    </div>`).join("");
}

function changeQty(idx, delta) {
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  updateCartUI();
  renderCartItems();
  renderMenu();
}

function updateNote(idx, val) {
  cart[idx].note = val;
}

// ── Place Order ─────────────────────────────────────────────────────────────
async function placeOrder() {
  if (!cart.length) return;
  const btn = document.getElementById("placeBtn");
  btn.disabled = true;
  btn.textContent = "Sending…";

  const note = document.getElementById("orderNote").value.trim();
  const orderId = "QR" + Date.now().toString(36).toUpperCase().slice(-6);
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);

  const isTakeaway = (tableNum === 9999 || tableNum === "9999" || (typeof tableNum === "string" && tableNum.toLowerCase() === "takeaway"));
  const order = {
    id: orderId,
    ts: Date.now(),
    tableNum: isTakeaway ? 9999 : parseInt(tableNum),
    items: JSON.parse(JSON.stringify(cart)),
    note,
    total,
    currency,
    status: "pending",
  };

  try {
    // Write to localStorage + Supabase
    await pushQROrder(order);

    // Show success
    showSuccessScreen(order);
  } catch (err) {
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = "Send to Kitchen 🍽";
  }
}

async function pushQROrder(order) {
  // 1. Always save to localStorage as fallback
  try {
    const raw = localStorage.getItem(QR_ORDERS_KEY);
    const existing = raw ? JSON.parse(raw) : [];
    existing.unshift(order);
    localStorage.setItem(QR_ORDERS_KEY, JSON.stringify(existing.slice(0, 100)));
  } catch(e) {}

  // 2. Push to Supabase if connected
  if (customerSupabase) {
    try {
      const { error } = await customerSupabase.from("pos_qr_orders").insert([{
        id: order.id,
        ts: order.ts,
        table_num: order.tableNum,
        items: order.items,
        note: order.note || null,
        total: order.total,
        currency: order.currency,
        status: order.status
      }]);
      if (error) {
        console.error("Supabase insert error:", error);
        alert("Supabase Database Error: " + JSON.stringify(error));
      } else {
        console.log("QR order pushed to Supabase:", order.id);
      }
    } catch (e) {
      console.error("Failed to push QR order to Supabase:", e);
      alert("Failed to push to Supabase: " + e.message);
    }
  } else {
    alert("Warning: Not connected to Supabase database. The order is stored locally but will not show up on the POS dashboard. Please verify database config/connection.");
  }
}

function showSuccessScreen(order) {
  closeCart();
  document.getElementById("mainApp").style.display = "none";
  document.getElementById("bottomBar").style.display = "none";
  const ss = document.getElementById("successScreen");
  ss.classList.add("show");
  document.getElementById("successOrderId").textContent = `#${order.id}`;
  if (order.tableNum === 9999) {
    document.getElementById("successSub").innerHTML =
      `Your order has been sent to the kitchen.<br>Please pick it up at the counter shortly.`;
  } else {
    document.getElementById("successSub").innerHTML =
      `Your order has been sent to the kitchen.<br>We'll bring it to <strong>Table ${order.tableNum}</strong> shortly.`;
  }
  document.getElementById("successItems").innerHTML =
    order.items.map(i => `
      <div class="osc-item">
        <span class="osc-item-name">${i.name}</span>
        <span class="osc-item-right">×${i.qty} &nbsp; ${currency}${(i.price*i.qty).toFixed(2)}</span>
      </div>`).join("") +
    `<div class="osc-item" style="font-weight:700">
      <span>Total</span>
      <span style="color:var(--amber-bright)">${currency}${order.total.toFixed(2)}</span>
    </div>`;
  cart = [];
  updateCartUI();

  // Start modification window timer
  startModificationCountdown(order);
}

function startModificationCountdown(order) {
  lastPlacedOrder = order;
  const panel = document.getElementById("modificationPanel");
  if (panel) panel.style.display = "block";

  const timer = document.getElementById("timerCountdown");
  if (timer) timer.textContent = "60s";

  let timeLeft = 60;
  if (countdownInterval) clearInterval(countdownInterval);

  countdownInterval = setInterval(() => {
    timeLeft--;
    if (timer) timer.textContent = `${timeLeft}s`;
    
    if (timeLeft <= 0) {
      clearInterval(countdownInterval);
      countdownInterval = null;
      if (panel) panel.style.display = "none";
    }
  }, 1000);
}

async function modifyPlacedOrder() {
  if (!lastPlacedOrder) return;
  
  if (countdownInterval) {
    clearInterval(countdownInterval);
    countdownInterval = null;
  }
  
  const order = lastPlacedOrder;
  
  // 1. Update status to 'modified' in local storage
  try {
    const raw = localStorage.getItem(QR_ORDERS_KEY);
    if (raw) {
      const orders = JSON.parse(raw);
      const idx = orders.findIndex(o => o.id === order.id);
      if (idx >= 0) {
        orders[idx].status = "modified";
        localStorage.setItem(QR_ORDERS_KEY, JSON.stringify(orders));
      }
    }
  } catch (e) {}
  
  // 2. Update status to 'modified' in Supabase
  if (customerSupabase) {
    try {
      await customerSupabase.from("pos_qr_orders")
        .update({ status: "modified" })
        .eq("id", order.id);
    } catch (e) {
      console.error("Failed to mark order as modified in Supabase:", e);
    }
  }
  
  // 3. Restore cart
  cart = JSON.parse(JSON.stringify(order.items));
  updateCartUI();
  
  // 4. Close success screen, go back to main app and open cart drawer
  document.getElementById("successScreen").classList.remove("show");
  document.getElementById("mainApp").style.display = "block";
  openCart();
  
  showToast("Restored items to cart. Make your changes and send again!");
}

async function cancelPlacedOrder() {
  if (!lastPlacedOrder) return;
  
  if (!confirm("Are you sure you want to cancel this order?")) return;
  
  if (countdownInterval) {
    clearInterval(countdownInterval);
    countdownInterval = null;
  }
  
  const order = lastPlacedOrder;
  
  // 1. Update status to 'cancelled' in local storage
  try {
    const raw = localStorage.getItem(QR_ORDERS_KEY);
    if (raw) {
      const orders = JSON.parse(raw);
      const idx = orders.findIndex(o => o.id === order.id);
      if (idx >= 0) {
        orders[idx].status = "cancelled";
        localStorage.setItem(QR_ORDERS_KEY, JSON.stringify(orders));
      }
    }
  } catch (e) {}
  
  // 2. Update status to 'cancelled' in Supabase
  if (customerSupabase) {
    try {
      await customerSupabase.from("pos_qr_orders")
        .update({ status: "cancelled" })
        .eq("id", order.id);
    } catch (e) {
      console.error("Failed to mark order as cancelled in Supabase:", e);
    }
  }
  
  // 3. Close success screen and reset
  document.getElementById("successScreen").classList.remove("show");
  document.getElementById("mainApp").style.display = "block";
  cart = [];
  updateCartUI();
  renderMenu();
  
  showToast("Your order was successfully cancelled.");
}

function resetForMoreOrdering() {
  document.getElementById("successScreen").classList.remove("show");
  document.getElementById("mainApp").style.display = "block";
  renderMenu();
}

// ── Toast ────────────────────────────────────────────────────────────────────
let toastTimeout;
function showToast(msg) {
  const wrap = document.getElementById("toastWrap");
  document.getElementById("toastMsg").textContent = msg;
  wrap.style.display = "block";
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => { wrap.style.display = "none"; }, 2000);
}

window.addEventListener("DOMContentLoaded", init);
