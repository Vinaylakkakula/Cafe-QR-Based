<style>:root {
  --bg: #0e0f11;
  --bg-1: #15171a;
  --bg-2: #1b1e22;
  --bg-3: #24282e;
  --line: #2a2f36;
  --line-2: #363c44;
  --text: #f2ede2;
  --text-dim: #a8a79f;
  --text-muted: #6b6e74;
  --amber: #f2a43a;
  --amber-bright: #ffb84a;
  --amber-dim: #3a2a12;
  --amber-soft: rgba(242, 164, 58, 0.12);
  --green: #6bbf7b;
  --red: #e26060;
  --blue: #67a2d9;
  --violet: #a88ad9;
  --shadow-lg: 0 20px 60px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
  --shadow-md: 0 8px 24px rgba(0,0,0,.35);
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; height: 100%; overflow: hidden; }
#root { height: 100vh; display: grid; grid-template-columns: 72px 1fr; grid-template-rows: 1fr; }

/* Dashboard layout */
.sidebar {
  background: var(--bg-1);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  align-items: center;
  padding: 14px 0;
  gap: 4px;
  overflow: hidden;
}
.sidebar-brand {
  width: 40px; height: 40px; border-radius: 10px;
  background: linear-gradient(135deg, var(--amber), #c4761e);
  display: grid; place-items: center;
  color: #1a0f00; font-weight: 800; font-size: 18px;
  box-shadow: 0 0 20px rgba(242,164,58,.3);
  margin-bottom: 14px;
}
.sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
.sidebar-btn {
  width: 48px; height: 48px; border-radius: 10px;
  display: grid; place-items: center;
  color: var(--text-dim); position: relative;
  transition: all .15s ease;
}
.sidebar-btn:hover { background: var(--bg-2); color: var(--text); }
.sidebar-btn.active { background: var(--amber-soft); color: var(--amber-bright); }
.sidebar-btn.active::before {
  content: ''; position: absolute; left: -14px; top: 10px; bottom: 10px; width: 3px;
  background: var(--amber); border-radius: 0 2px 2px 0;
}
.sidebar-btn .pulse {
  position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%;
  background: var(--amber); box-shadow: 0 0 6px var(--amber);
}
.sidebar-label {
  position: absolute; left: 60px; background: var(--bg-3); border: 1px solid var(--line-2);
  padding: 4px 10px; border-radius: 6px; font-size: 12px; white-space: nowrap;
  color: var(--text); pointer-events: none; opacity: 0; transform: translateX(-6px);
  transition: all .15s; z-index: 50; font-weight: 500;
}
.sidebar-btn:hover .sidebar-label { opacity: 1; transform: translateX(0); }
.sidebar-spacer { flex: 1; }

.main-col {
  display: flex; flex-direction: column;
  overflow: hidden;
  min-width: 0;
  min-height: 0;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; }
::selection { background: var(--amber); color: #000; }

/* Scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--line-2); }

/* Top bar */
.topbar {
  height: 64px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 20px;
  flex-shrink: 0;
}
.page-title { flex: 1; }
.page-title-main { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
.page-title-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* Stats strip */
.stats-strip {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 1px;
  background: var(--line);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.stat-tile {
  background: var(--bg-1);
  padding: 14px 20px;
  display: flex; flex-direction: column; gap: 4px;
  position: relative;
}
.stat-tile-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.stat-tile-value { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; font-family: 'JetBrains Mono', monospace; }
.stat-tile-value.accent { color: var(--amber-bright); }
.stat-tile-value.green { color: var(--green); }
.stat-tile-value.blue { color: var(--blue); }
.stat-tile-value.violet { color: var(--violet); }
.stat-tile-delta { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }

/* Dashboard body */
.dash-body {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 380px;
  overflow: hidden;
  min-height: 0;
  gap: 1px;
  background: var(--line);
}
.dash-center { background: var(--bg); overflow: auto; padding: 20px 24px; min-height: 0; }
.dash-right {
  background: var(--bg-1);
  display: flex; flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

/* Panel chrome */
.panel {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
}

.panel-title .count-pill { background: var(--bg-3); color: var(--text-dim); font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; font-family: 'JetBrains Mono', monospace; }
.panel-sub { font-size: 11px; color: var(--text-dim); }
.panel-body { padding: 14px 16px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.search-box {
  display: flex; align-items: center; gap: 8px;

  padding: 7px 12px; width: 240px; color: var(--text-dim);

.search-box kbd { background: var(--bg-3); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 20px; }
.clock { text-align: right; font-variant-numeric: tabular-nums; }

}

/* Main layout (legacy alias still used by non-floor views) */
.workspace { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.workspace-inner { flex: 1; overflow: auto; padding: 20px 24px; min-height: 0; }

  margin-bottom: 10px; margin-top: 4px;
}

.order-panel { background: transparent; border-left: none; }

.ticker {

.ticker-title { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.ticker-item {

}

.cat-tab.active { background: var(--bg-2); color: var(--amber-bright); border-color: var(--line-2); }

.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));

.menu-card {
  background: var(--bg-1);

<style id="mobile-modal-nuclear-fix">
/* ============================================================
   NUCLEAR MOBILE MODAL FIX - Embedded directly in HTML
   Cannot be cached, cannot be overridden by external files
   ============================================================ */
@media (max-width: 768px) {

  /* Step 1: Backdrop anchors to bottom */
  .modal-backdrop {
    padding: 0 !important;
    align-items: flex-end !important;
    place-items: unset !important;
  }

  /* Step 2: Modal is a flex column bottom-sheet
     height:auto = sizes to content (no blank space)
     max-height = cap at 88% viewport
     overflow:hidden = REQUIRED for flex-child scrolling to work */
  .modal {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    border-radius: 20px 20px 0 0 !important;
    height: auto !important;
    max-height: 88dvh !important;
    max-height: 88vh !important;
    overflow: hidden !important;
    display: flex !important;
    flex-direction: column !important;
    margin: 0 !important;
    border-left: none !important;
    border-right: none !important;
    border-bottom: none !important;
    /* Kill any inline width/maxHeight that JS sets */
    box-sizing: border-box !important;
  }

  /* Step 3: Head never grows or shrinks */
  .modal-head {
    flex: 0 0 auto !important;
    flex-shrink: 0 !important;
    flex-grow: 0 !important;
    padding: 16px 18px 14px !important;
    background: var(--bg-1) !important;
    border-bottom: 1px solid var(--line) !important;
    border-top: 3px solid transparent !important;
    background-clip: padding-box !important;
    z-index: 2 !important;
    /* Drag handle */
    padding-top: 20px !important;
  }
  .modal-head::before {
    content: '' !important;
    display: block !important;
    width: 36px !important;
    height: 4px !important;
    background: rgba(255,255,255,0.15) !important;
    border-radius: 2px !important;
    margin: -8px auto 12px auto !important;
  }

  /* Step 4: THE KEY - body scrolls, takes available space
     flex: 1 1 0 = grow to fill, shrink, base size 0
     min-height: 0 = CRITICAL: lets flex item shrink below content height
     overflow-y: auto = scroll when content taller than allocated space
     WITHOUT min-height:0, overflow never triggers in flex containers! */
  .modal-body {
    flex: 1 1 0 !important;
    min-height: 0 !important;
    /* Override the desktop calc-based max-height */
    max-height: calc(88vh - 130px) !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    -webkit-overflow-scrolling: touch !important;
    overscroll-behavior-y: contain !important;
    padding: 16px 18px !important;
  }

  /* Step 5: Footer never grows, always at bottom */
  .modal-foot {
    flex: 0 0 auto !important;
    flex-shrink: 0 !important;
    flex-grow: 0 !important;
    display: flex !important;
    gap: 10px !important;
    padding: 12px 18px !important;
    padding-bottom: max(18px, env(safe-area-inset-bottom, 18px)) !important;
    border-top: 1px solid var(--line) !important;
    background: var(--bg-1) !important;
    z-index: 2 !important;
    justify-content: stretch !important;
  }
  .modal-foot .btn {
    flex: 1 !important;
    padding: 13px !important;
    font-size: 14px !important;
    justify-content: center !important;
  }

  /* Step 6: Force single-column form layout for touch */
  .settings-grid {
    display: grid !important;
    grid-template-columns: 1fr !important;
    gap: 14px !important;
  }
  .setting-field {
    grid-column: 1 / -1 !important;
  }
  .setting-field input,
  .setting-field select,
  .setting-field textarea {
    font-size: 16px !important;
    padding: 13px 12px !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }
  .setting-field label {
    font-size: 12px !important;
    margin-bottom: 6px !important;
    display: block !important;
  }
}

/* Print Overrides at the bottom of the style tag to win the cascade */
@media print {
  /* 1. Hide the entire React root layout and standard page layouts */
  #root,
  #root > *,
  .no-print,
  .modal-head,
  .modal-foot,
  .header,
  .bottom-bar,
  .sidebar,
  .workspace {
    display: none !important;
  }

  /* 2. Reset html & body to be a simple, scrollable, background-free printing flow */
  html, body {
    background: #fff !important;
    color: #000 !important;
    height: auto !important;
    min-height: 0 !important;
    overflow: visible !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* 3. Strip down modal overlay elements and portals to display: block without any viewport limitations */
  body > div,
  .modal-backdrop,
  .modal,
  .modal-body {
    display: block !important;
    position: static !important;
    background: none !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin: 0 !important;
    width: auto !important;
    height: auto !important;
    max-height: none !important;
    min-height: 0 !important;
    overflow: visible !important;
    transform: none !important;
    animation: none !important;
  }

  /* 4. Hide all siblings of the print target inside the modal body */
  .modal-body > *:not(.print-target) {
    display: none !important;
  }

  /* 5. Force visibility of print-target elements specifically */
  body * { visibility: hidden !important; }
  .print-target, .print-target * { visibility: visible !important; }

  /* 6. Layout of KOT/receipt container to align at the top-left */
  .print-target {
    display: block !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 80mm !important;
    margin: 0 !important;
    padding: 4px !important;
    background: #fff !important;
    color: #000 !important;
    box-shadow: none !important;
    border: none !important;
    font-family: 'Courier New', monospace !important;
  }

  /* 7. Force high-contrast values for text and lines */
  .print-target * {
    background: #fff !important;
    color: #000 !important;
    border-color: #000 !important;
  }
  .print-target .kot-note { color: #555 !important; }
  @page { size: 80mm auto; margin: 0; }
}
